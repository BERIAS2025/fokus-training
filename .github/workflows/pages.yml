name: Deploy auf GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Offline-Cache prüfen
        run: node tools/check-precache.cjs
      - name: Build-Kennung setzen (neuer Cache je Deploy)
        run: |
          BUILD="${GITHUB_SHA::7}-$(date -u +%Y%m%d%H%M)"
          sed -i "s/__BUILD__/$BUILD/" app/sw.js app/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app
      - id: deployment
        uses: actions/deploy-pages@v4
